name: Build Debian packages

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish signed APT repository to GitHub Pages
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.suite }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: jammy
            image: ubuntu:22.04
          - suite: noble
            image: ubuntu:24.04
          - suite: resolute
            image: ubuntu:26.04
          - suite: trixie
            image: debian:trixie
    steps:
      - name: Install checkout prerequisites
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git

      - uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends build-essential devscripts equivs
          DEBIAN_FRONTEND=noninteractive mk-build-deps --install --remove \
            --tool 'apt-get -y --no-install-recommends' debian/control

      - name: Build and validate package
        run: bash packaging/build-deb.sh '${{ matrix.suite }}'

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.suite }}
          path: dist/${{ matrix.suite }}/*.deb
          retention-days: 14
          if-no-files-found: error

  publish:
    if: github.event_name == 'workflow_dispatch' && inputs.publish && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          path: packages
          merge-multiple: false

      - name: Build signed APT index
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apt-utils dpkg-dev gnupg
          bash packaging/make-apt-repo.sh packages site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - uses: actions/deploy-pages@v4
        id: deployment
